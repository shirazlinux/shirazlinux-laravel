<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="کاوش — آنالیز">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- window chrome -->
  <g filter="url(#soft)">
    <rect x="70" y="70" width="660" height="360" rx="22" fill="#0c0a09" fill-opacity="0.35"/>
    <rect x="70" y="70" width="660" height="48" rx="22" fill="#000" fill-opacity="0.28"/>
    <circle cx="104" cy="94" r="7" fill="#F87171"/>
    <circle cx="128" cy="94" r="7" fill="#FBBF24"/>
    <circle cx="152" cy="94" r="7" fill="#4ADE80"/>
    <rect x="190" y="82" width="420" height="24" rx="12" fill="#fff" fill-opacity="0.12"/>
    <text x="400" y="99" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity="0.75">Umami Analytics</text>
    <text x="400" y="250" text-anchor="middle" font-size="64">📊</text>
    <text x="400" y="320" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="36" font-weight="700" fill="#fff">کاوش — آنالیز</text>
    <text x="400" y="360" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="16" fill="#fff" fill-opacity="0.8">sudoshz.ir</text>
  </g>
</svg>
